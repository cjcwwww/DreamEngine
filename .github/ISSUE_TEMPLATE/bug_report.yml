name: Bug 报告 / Bug report
description: 报告安装、Hub、AE 面板或渲染问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认使用的是 [最新 Beta](https://github.com/yoanx/DreamEngine/releases)，并尽量提供可复现步骤和日志。

  - type: input
    id: dreamengine-version
    attributes:
      label: DreamEngine 版本 / Version
      description: Hub 和面板版本，例如 Hub 0.1.0 / Panel 0.2.0
      placeholder: DreamEngine Hub 0.1.0 / Panel 0.2.0
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 问题位置 / Component
      options:
        - DreamEngine Hub
        - AE 面板 / CEP panel
        - 效果 / Effects
        - 预设 / Presets
        - 曲线 / Curves
        - 素材 / Media library
        - 离线渲染 / Offline rendering
        - 安装或升级 / Installation
        - 其他 / Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 系统环境 / Environment
      description: Windows 版本、After Effects 版本、CEP 版本
      placeholder: Windows 11 24H2 / After Effects 2021 18.4.1 / CEP 11
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与错误信息 / Logs
      description: Hub 渲染日志位于“文档/DreamEngineProbe”。请勿上传素材、工程或敏感路径。
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏 / Screenshots
      description: 可直接拖入图片。截图请尽量包含完整窗口和相关设置。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已尝试最新 Beta，并搜索过现有 Issues
          required: true
        - label: 我已移除日志或截图中的隐私和敏感信息
          required: true
