<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src * data: file: blob: 'unsafe-inline' 'unsafe-eval';"/>
  <title>DreamEngine</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <nav class="view-switch" role="tablist" aria-label="主视图切换">
    <button class="view-tab active" id="tabEffects" type="button" role="tab" aria-selected="true">
      效果预览
    </button>
    <button class="view-tab" id="tabPresets" type="button" role="tab" aria-selected="false">
      预设预览
    </button>
  </nav>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">DE</span>
      <div>
        <h1>DreamEngine</h1>
        <p id="libraryStats">正在读取效果库</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="segmented" role="group" aria-label="语言">
        <button class="segment active" id="langZh" type="button">中文</button>
        <button class="segment" id="langEn" type="button">EN</button>
      </div>
      <button class="action-button" id="btnGenerate" type="button" title="在当前合成环境下渲染缺失的预览">
        生成缺失预览
      </button>
      <button class="action-button" id="btnRetry" type="button" hidden title="重新排队失败的条目">
        重试失败
      </button>
      <button class="icon-button" id="btnRefresh" type="button" title="重新扫描 AE 效果" aria-label="重新扫描 AE 效果">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="controls" id="effectControls">
    <div class="search-wrap" id="searchWrap">
      <button class="icon-button search-toggle" id="searchToggle" type="button"
              title="搜索效果或分类" aria-label="搜索效果或分类" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      </button>
      <label class="search-field" id="searchField" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索效果或分类" autocomplete="off"/>
      </label>
    </div>
    <select id="pluginFilter" aria-label="插件筛选">
      <option value="全部">全部来源</option>
      <option value="内置" selected>内置</option>
      <option value="BCC">BCC</option>
      <option value="Sapphire">Sapphire</option>
      <option value="Red Giant">Red Giant</option>
      <option value="RE:Vision">RE:Vision</option>
      <option value="Video Copilot">Video Copilot</option>
      <option value="其它插件">其它插件</option>
    </select>
    <div class="segmented" role="group" aria-label="排序">
      <button class="segment active" id="sortName" type="button">按名称</button>
      <button class="segment" id="sortCategory" type="button">按分类</button>
    </div>
    <label class="toggle">
      <input type="checkbox" id="showAll"/>
      <span>全部已安装</span>
    </label>
  </section>

  <div class="workspace" id="viewEffects">
    <aside class="sidebar">
      <h2 class="sidebar-title">分类</h2>
      <ul class="category-list" id="categoryList"></ul>
    </aside>

    <main>
      <div class="grid" id="previewGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <strong>没有匹配的效果</strong>
      </div>
    </main>
  </div>

  <section class="preset-view" id="viewPresets" hidden aria-label="预设预览">
    <div class="preset-head">
      <h2>预设库</h2>
      <div class="preset-tools">
        <div class="search-wrap" id="presetSearchWrap">
          <button class="icon-button search-toggle" id="presetSearchToggle" type="button"
                  title="搜索预设" aria-label="搜索预设" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
          </button>
          <label class="search-field" id="presetSearchField" hidden>
            <input id="presetSearch" type="search" placeholder="搜索预设" autocomplete="off"/>
          </label>
        </div>
        <button class="action-button" id="btnPresetAdd" type="button" title="选择 .ffx 文件加入预设库">添加预设</button>
      </div>
    </div>
    <div class="preset-summary" id="presetSummary"></div>
    <div class="preset-grid" id="presetList"></div>
  </section>

  <footer class="statusbar">
    <span id="statusText">准备扫描</span>
    <span class="size-slider">
      <label for="thumbSize">预览大小</label>
      <input id="thumbSize" type="range" min="48" max="180" step="2" value="132"/>
      <output id="thumbSizeValue">132</output>
    </span>
    <span id="selectionStats"></span>
    <button class="queue-toggle" id="btnQueue" type="button" title="查看生成队列">
      队列 <span id="queueCounts">—</span>
    </button>
  </footer>

  <aside class="queue-drawer" id="queueDrawer" hidden aria-label="生成队列">
    <div class="queue-head">
      <h3>生成队列</h3>
      <button class="icon-button" id="btnQueueClose" type="button" aria-label="关闭队列">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div class="queue-actions">
      <button class="action-button" id="btnQueueRetry" type="button">重试失败</button>
      <span class="queue-summary" id="queueSummary"></span>
    </div>
    <ul class="queue-list" id="queueList"></ul>
  </aside>

  <script src="js/bridge.js"></script>
  <script src="js/viewmodel.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
