<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src * data: file: blob: 'unsafe-inline' 'unsafe-eval';"/>
  <title>DreamEngine</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <nav class="view-switch" role="tablist" aria-label="主视图切换">
    <button class="view-tab active" id="tabEffects" type="button" role="tab" aria-selected="true">
      效果预览
    </button>
    <button class="view-tab" id="tabPresets" type="button" role="tab" aria-selected="false">
      预设预览
    </button>
  </nav>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">DE</span>
      <div>
        <h1>DreamEngine</h1>
        <p id="libraryStats">正在读取效果库</p>
      </div>
    </div>
    <div class="top-actions">
      <!-- 语言 / 生成 / 刷新 / 重试都收进「设置」页：顶栏只留一个入口，
           面板拖窄时品牌区不会被一堆按钮挤到换行。 -->
      <button class="icon-button" id="btnSettings" type="button"
              title="设置" aria-label="设置" aria-expanded="false" aria-controls="settingsDrawer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="controls" id="effectControls">
    <div class="search-wrap" id="searchWrap">
      <button class="icon-button search-toggle" id="searchToggle" type="button"
              title="搜索效果或分类" aria-label="搜索效果或分类" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      </button>
      <label class="search-field" id="searchField" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索效果或分类" autocomplete="off"/>
      </label>
    </div>
    <select id="pluginFilter" aria-label="插件筛选">
      <option value="全部">全部来源</option>
      <option value="内置" selected>内置</option>
      <option value="BCC">BCC</option>
      <option value="Sapphire">Sapphire</option>
      <option value="Red Giant">Red Giant</option>
      <option value="RE:Vision">RE:Vision</option>
      <option value="Video Copilot">Video Copilot</option>
      <option value="其它插件">其它插件</option>
    </select>
    <div class="segmented" role="group" aria-label="排序">
      <button class="segment active" id="sortName" type="button">按名称</button>
      <button class="segment" id="sortCategory" type="button">按分类</button>
    </div>
    <label class="toggle">
      <input type="checkbox" id="showAll"/>
      <span>全部已安装</span>
    </label>
  </section>

  <div class="workspace" id="viewEffects">
    <aside class="sidebar">
      <h2 class="sidebar-title">分类</h2>
      <ul class="category-list" id="categoryList"></ul>
    </aside>

    <main>
      <div class="grid" id="previewGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <strong>没有匹配的效果</strong>
      </div>
    </main>
  </div>

  <section class="preset-view" id="viewPresets" hidden aria-label="预设预览">
    <div class="preset-head">
      <h2>预设库</h2>
      <div class="preset-tools">
        <div class="search-wrap" id="presetSearchWrap">
          <button class="icon-button search-toggle" id="presetSearchToggle" type="button"
                  title="搜索预设" aria-label="搜索预设" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="8"/>
              <path d="m21 21-4.3-4.3"/>
            </svg>
          </button>
          <label class="search-field" id="presetSearchField" hidden>
            <input id="presetSearch" type="search" placeholder="搜索预设" autocomplete="off"/>
          </label>
        </div>
        <button class="action-button" id="btnPresetAdd" type="button" title="选择 .ffx 文件加入预设库">添加预设</button>
      </div>
    </div>
    <div class="preset-summary" id="presetSummary"></div>
    <div class="preset-grid" id="presetList"></div>
  </section>

  <footer class="statusbar">
    <span id="statusText" title="">准备扫描</span>
    <span class="size-slider">
      <label for="thumbSize">预览大小</label>
      <input id="thumbSize" type="range" min="48" max="180" step="2" value="132"/>
      <output id="thumbSizeValue">132</output>
    </span>
    <span id="selectionStats"></span>
    <button class="queue-toggle" id="btnQueue" type="button" title="查看生成队列">
      队列 <span id="queueCounts">—</span>
    </button>
  </footer>

  <aside class="queue-drawer" id="queueDrawer" hidden aria-label="生成队列">
    <div class="queue-head">
      <h3>生成队列</h3>
      <button class="icon-button" id="btnQueueClose" type="button" aria-label="关闭队列">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div class="queue-actions">
      <button class="action-button" id="btnQueueRetry" type="button">重试失败</button>
      <span class="queue-summary" id="queueSummary"></span>
    </div>
    <ul class="queue-list" id="queueList"></ul>
  </aside>

  <aside class="settings-drawer" id="settingsDrawer" hidden aria-label="设置">
    <div class="queue-head">
      <h3>设置</h3>
      <button class="icon-button" id="btnSettingsClose" type="button" aria-label="关闭设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <div class="settings-scroll">
      <section class="settings-group">
        <h4>外观</h4>
        <div class="settings-row">
          <span class="settings-label">界面语言</span>
          <div class="segmented" role="group" aria-label="语言">
            <button class="segment active" id="langZh" type="button">中文</button>
            <button class="segment" id="langEn" type="button">EN</button>
          </div>
        </div>
      </section>

      <section class="settings-group">
        <h4>预览维护</h4>
        <button class="settings-action" id="btnGenerate" type="button">
          <span class="settings-action-title">生成缺失预览</span>
          <span class="settings-action-note">渲染当前 AE 环境里还没出图的内置效果</span>
        </button>
        <button class="settings-action" id="btnRefresh" type="button">
          <span class="settings-action-title">重新扫描 AE 效果</span>
          <span class="settings-action-note">刚装了新插件时用，强制重读效果清单</span>
        </button>
        <button class="settings-action" id="btnRetry" type="button" hidden>
          <span class="settings-action-title">重试失败</span>
          <span class="settings-action-note">把生成失败的条目重新排队</span>
        </button>
        <button class="settings-action" id="btnOpenQueue" type="button">
          <span class="settings-action-title">查看生成队列</span>
          <span class="settings-action-note">待渲染 / 渲染中 / 失败的逐条状态</span>
        </button>
      </section>

      <section class="settings-group">
        <h4>使用说明</h4>
        <p class="settings-note">
          在 AE 里选中图层后，<b>双击</b>效果卡片即可把该效果加到选中层。
          单击不会改动工程。悬停预览可播放动态效果，静止效果不播放。
        </p>
        <p class="settings-note">
          第三方插件的预览不能靠面板按钮实时生成（会让 AE 崩溃），
          需关闭 AE 后用离线脚本逐条渲染；插件参数一律保持默认。
        </p>
      </section>
    </div>
  </aside>

  <script src="js/bridge.js"></script>
  <script src="js/viewmodel.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
